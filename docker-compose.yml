services:
  privat-cloud:
    build: .
    image: privat-cloud:latest
    container_name: privat-cloud
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Optional – ohne JWT_SECRET wird eines erzeugt und im Volume gespeichert.
      JWT_SECRET: ${JWT_SECRET:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - privat-cloud-data:/data

volumes:
  privat-cloud-data:
